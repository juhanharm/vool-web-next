- name: posts_en
  label: Blog and articles (English)
  label_singular: Post
  folder: src/content/imported/en
  extension: json
  format: json
  create: true
  slug: '{{title}}'
  summary: '{{title}} ({{kind}})'
  fields:
  - name: title
    label: Title
    widget: string
  - name: kind
    label: Type
    widget: select
    options:
    - label: Blog post
      value: blog
    - label: Use case
      value: usecase
    - label: Plain page (terms, FAQ)
      value: generic
    default: blog
  - name: date
    label: Date shown on the post
    widget: string
    required: false
    hint: 'For example: November 23, 2026'
  - name: readTime
    label: Reading time
    widget: string
    required: false
    hint: 'For example: 4 min read'
  - name: image
    label: Cover image
    widget: image
    required: false
  - name: description
    label: Short description (for Google and sharing)
    widget: text
    required: false
  - name: seoTitle
    label: Title for Google (optional)
    widget: string
    required: false
  - name: markdown
    label: Text
    widget: markdown
    required: false
    hint: Write new posts here.
  - name: body
    label: Text as HTML (articles moved from the old site)
    widget: text
    required: false
    hint: Used only when the Text field above is empty.
  - name: path
    label: Web address (leave empty for new posts)
    widget: string
    required: false
  - name: lang
    label: Language
    widget: hidden
    default: en
