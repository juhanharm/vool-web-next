# Section forms are generated by scripts/make_editor_config.py from the page data.
backend:
  name: github
  repo: juhanharm/vool-web-next
  branch: main
site_url: https://www.vool.com
media_folder: public/media/uploads
public_folder: /media/uploads
collections:
- name: pages
  label: Pages
  label_singular: Page
  folder: src/content/pages-json
  extension: json
  format: json
  create: true
  slug: '{{fields.title}}'
  summary: '{{path}} – {{title}}'
  sortable_fields:
  - path
  - title
  fields:
  - name: path
    label: Web address
    widget: string
    hint: Starts and ends with a slash, for example /solutions/workplace/
  - name: title
    label: Page title (browser tab and Google)
    widget: string
  - name: description
    label: Description (Google and sharing)
    widget: text
  - name: image
    label: Sharing image
    widget: image
    required: false
  - name: lang
    label: Language
    widget: select
    options:
    - en
    - et
    - lt
    - fi
    - sv
    required: false
  - name: alternates
    label: Same page in other languages
    widget: object
    required: false
    collapsed: true
    fields:
    - name: en
      label: EN address
      widget: string
      required: false
    - name: et
      label: ET address
      widget: string
      required: false
    - name: lt
      label: LT address
      widget: string
      required: false
    - name: fi
      label: FI address
      widget: string
      required: false
    - name: sv
      label: SV address
      widget: string
      required: false
  - name: sections
    label: Sections
    label_singular: section
    widget: list
    types:
    - name: hero
      label: Top banner
      widget: object
      summary: '{{title}}'
      fields:
      - name: eyebrow
        label: Small label above the title
        required: false
        widget: string
      - name: title
        label: Title
        required: false
        widget: text
      - name: lead
        label: Intro text
        required: false
        widget: text
      - name: image
        label: Image
        required: false
        widget: image
      - name: alt
        label: Image description
        required: false
        widget: string
      - name: dark
        label: Dark background
        required: false
        widget: boolean
      - name: cta
        label: Buttons
        required: false
        widget: list
        fields:
        - name: label
          label: Label
          required: false
          widget: string
        - name: href
          label: Link
          required: false
          widget: string
        summary: '{{title}}{{label}}{{q}}{{name}}'
      - name: facts
        label: Facts
        required: false
        widget: list
        field:
          name: value
          label: Text
          widget: string
      - name: variant
        label: Variant
        required: false
        widget: string
    - name: split
      label: Text with image
